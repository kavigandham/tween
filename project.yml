name: TweenApp
options:
  bundleIdPrefix: com.kavigandham
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "T4VT6R837D"

targets:
  TweenApp:
    type: application
    platform: iOS
    sources:
      # The TweenApp directory is globbed recursively, so it already includes
      # HarnessView.swift (DEBUG screenshot harness) and PrivacyInfo.xcprivacy
      # (bundled as a resource). Listed here for visibility — XcodeGen rejects
      # an explicit path that also matches a directory glob.
      - path: TweenApp
      - path: Shared
      # Pure UIKit/MapKit renderer (no Messages APIs) — compiled into the app too
      # so TweenAppTests can cover it via `@testable import TweenApp`.
      - path: TweenMessages/BubbleImageRenderer.swift
    entitlements:
      path: TweenApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kavigandham.tween
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kavigandham.TweenApp
        INFOPLIST_FILE: TweenApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: TweenApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TweenMessages
    info:
      path: TweenApp/Info.plist
      properties:
        CFBundleDisplayName: Tween
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "3"
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: com.kavigandham.TweenApp
            CFBundleURLSchemes:
              - tween
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # "while the app is open", NOT "once" — the host runs a continuous
        # foreground stream so the dot tracks you like Maps. The old string
        # predated that and was factually wrong in the first alert a reviewer
        # reads (5.1.1 mismatch, readiness audit 2026-08-06). The EXTENSION's
        # string keeps "once": it genuinely takes single fixes.
        # "in messages you choose to send", not "when you tap I'm in" — Agree,
        # Counter, and Send-to-chat also embed the coordinate, and the movement
        # tick keeps it current after joining. Every share still rides in an
        # explicit user-sent message, which is the honest claim (audit 2026-08-06).
        NSLocationWhenInUseUsageDescription: "Tween uses your location while the app is open to show you on the map and find fair meetup spots. It is shared only in messages you choose to send."
        NSContactsUsageDescription: "Tween uses your contacts so you can pick a friend to invite to a meetup."
        NSCalendarsWriteOnlyAccessUsageDescription: "Tween adds a meetup you plan to your calendar. It never reads your existing events."

  TweenMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      # Directory glob includes TweenMessages/PrivacyInfo.xcprivacy, bundled as
      # a resource in the extension.
      - path: TweenMessages
      - path: Shared
    entitlements:
      path: TweenMessages.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kavigandham.tween
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kavigandham.TweenApp.messages
        INFOPLIST_FILE: TweenMessages/Info.plist
        CODE_SIGN_ENTITLEMENTS: TweenMessages.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
    info:
      path: TweenMessages/Info.plist
      properties:
        CFBundleDisplayName: Tween
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "3"
        MSMessagesExtensionStoreIconName: iMessage App Icon
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
        NSLocationWhenInUseUsageDescription: "Tween uses your location once to share where you are for a meetup."

  TweenAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TweenAppTests
      # StoreKit test configuration bundled as a test resource so
      # ProEntitlementTests can drive real (local) StoreKit purchases via
      # SKTestSession. Lives at repo root so the app target globs never ship it.
      - path: TweenPro.storekit
        buildPhase: resources
    dependencies:
      - target: TweenApp
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kavigandham.TweenApp.TweenAppTests
        GENERATE_INFOPLIST_FILE: YES

  TweenAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TweenAppUITests
      # SKTestSession(configurationFileNamed:) resolves against the TEST
      # bundle, so the paywall capture test needs its own copy — the scheme's
      # run-action storeKitConfiguration below doesn't reach xcodebuild test.
      - path: TweenPro.storekit
        buildPhase: resources
    dependencies:
      - target: TweenApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kavigandham.TweenApp.TweenAppUITests
        GENERATE_INFOPLIST_FILE: YES

# Explicit shared scheme (replaces the auto-generated one) so Run carries the
# local StoreKit configuration — Xcode ⌘R shows the Tween Pro test products
# and purchase sheet without App Store Connect. Unit tests load the same file
# programmatically via SKTestSession, so `xcodebuild test` needs nothing extra.
schemes:
  TweenApp:
    build:
      targets:
        TweenApp: all
    run:
      config: Debug
      # The leading `../` is NOT a typo, and removing it silently breaks the
      # local store. XcodeGen writes this identifier relative to the .xcscheme
      # (TweenApp.xcodeproj/xcshareddata/xcschemes/), which is THREE levels
      # below the repo root. Plain `TweenPro.storekit` emitted
      # `../../TweenPro.storekit`, pointing inside the .xcodeproj at a file
      # that does not exist — so Xcode ran with no StoreKit configuration and
      # the paywall showed "The App Store isn't reachable right now" on every
      # Cmd-R (2026-08-05).
      storeKitConfiguration: ../TweenPro.storekit
    test:
      config: Debug
      targets:
        - TweenAppTests
        - TweenAppUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
